apply plugin: 'com.android.application'

/* El número de versión vive en un archivo aparte y lo sube `scripts/apk.sh` en
   cada compilación. Aquí solo se lee: tenerlo a fuego en este archivo
   obligaría a acordarse de cambiarlo a mano, y nadie se acuerda. */
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def numeroDeVersion = (versionProps['build'] ?: '1') as Integer

/* La firma de publicación vive fuera del proyecto, en ~/.rutas-a, y nunca se
   sube a ningún repositorio. Android solo deja actualizar una app si la versión
   nueva lleva la misma firma que la instalada: si esta clave se perdiera,
   ningún teléfono podría actualizar sin desinstalar, y desinstalar borra sus
   datos. Por eso no está aquí dentro, y por eso hay que guardar una copia. */
def firmaProps = new Properties()
def firmaFile = new File(System.getProperty("user.home"), ".rutas-a/firma.properties")
def hayFirma = firmaFile.exists()
if (hayFirma) {
    firmaFile.withInputStream { firmaProps.load(it) }
}

android {
    namespace = "pe.rutasa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        /* Solo ARM.

           El lector de texto pesa ~11 MB por arquitectura, y el APK las
           traía todas: las dos de ARM, que son las de los celulares de
           verdad, y las dos de Intel, que solo sirven para emuladores. Como
           esto se instala a mano en teléfonos, las de Intel son 22 MB que
           nadie va a ejecutar. */
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        applicationId "pe.rutasa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode numeroDeVersion
        versionName "${numeroDeVersion}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hayFirma) {
            publicacion {
                storeFile file(firmaProps['storeFile'])
                storePassword firmaProps['storePassword']
                keyAlias firmaProps['keyAlias']
                keyPassword firmaProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hayFirma) {
                signingConfig signingConfigs.publicacion
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
