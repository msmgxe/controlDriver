# Número de versión del APK.
#
# Sube uno en cada compilación, lo hace `scripts/apk.sh` solo. Sirve para dos
# cosas: que el archivo que copias al celular diga qué versión es, y que
# Android sepa que una instalación es más nueva que la anterior —sin esto se
# niega a actualizar.
#
# Las versiones 1 a 6 se compilaron antes de que existiera este contador; están
# anotadas en VERSIONES.md para que la cuenta cuadre.
build=61

# El número que se ve (Ajustes, nombre del APK): empieza en 1.00 y `apk.sh` le sube
# una centésima en cada compilación. `build` es solo el código interno de
# Android, que debe crecer siempre y no se muestra.
nombre=1.10
