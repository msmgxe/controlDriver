<title>Letra y controles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Lora:wght@600;700&family=DM+Sans:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600&display=swap">
<style>
/* Elegir cómo se lee y cómo se toca la app, viendo el resultado al instante. */
:root{--bg:#eef2fb;--surf:#fff;--surf2:#e6ecfc;--ink:#0d1b4a;--ink2:#4a5780;--ink3:#78839f;--line:#d6def2;--acc:#1f5cff;--acc-ink:#fff;--acc-soft:#dce6ff;--sun:#ffc800;--sun-ink:#0a2260;--ok:#0c7d3c;--ok-soft:#dff5e6;
  --c1:#1f5cff;--c2:#0c7d3c;--c3:#b85a00;--c4:#7a3ff2;--c5:#a3274f;
  --fd:"Unbounded","Trebuchet MS",system-ui,sans-serif;--ft:"DM Sans",system-ui,sans-serif;--zt:1;
  --escala:1;--toque:56px;--sombra:0 6px 0 rgba(0,0,0,.18);--sombra-s:0 4px 0 rgba(0,0,0,.18);--sombra-a:0 2px 0 rgba(0,0,0,.18);--mov:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a1130;--surf:#141c44;--surf2:#1e2858;--ink:#eef1ff;--ink2:#b7c0e6;--ink3:#8a94c4;--line:#2a3470;--acc:#6d93ff;--acc-ink:#0a1130;--acc-soft:#223067;--ok:#4fd28a;--ok-soft:#14382a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1130;--surf:#141c44;--surf2:#1e2858;--ink:#eef1ff;--ink2:#b7c0e6;--ink3:#8a94c4;--line:#2a3470;--acc:#6d93ff;--acc-ink:#0a1130;--acc-soft:#223067;--ok:#4fd28a;--ok-soft:#14382a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 "Nunito",system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;padding-block:18px 56px}
h1,h2,h3{margin:0;font-family:"Fredoka",system-ui,sans-serif;font-weight:600}
h1{font-size:clamp(24px,4.5vw,34px)}.lede{color:var(--ink2);max-width:66ch;margin-top:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:16px}
.grupo h3{font-size:17px;margin-bottom:8px}.grupo small{color:var(--ink3);font-weight:700;display:block;margin-bottom:8px}
.opciones{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border-radius:16px;border:3px solid var(--line);background:var(--surf);transition:transform .12s,border-color .15s}
.op:active{transform:scale(.97)}.op[aria-checked=true]{border-color:var(--acc);background:var(--acc-soft)}
.op[aria-checked=true]::after{content:"✓";margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:15px}
.op b{display:block;font-size:20px;line-height:1.1}.op span small{display:block;margin:0;color:var(--ink3);font-size:12.5px}
.dos{grid-template-columns:1fr 1fr}.tres{grid-template-columns:repeat(3,1fr)}
.dos .op,.tres .op{justify-content:center;text-align:center;flex-direction:column;gap:2px;min-height:60px}
.dos .op::after,.tres .op::after{position:absolute}.dos .op,.tres .op{position:relative}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top button{padding:8px 14px;border-radius:99px;background:var(--surf);border:2px solid var(--line);font-weight:800;font-size:13px}
.top .titulo{flex:1}
/* ---- vista previa: usa SOLO las variables que cambian ---- */
.vista{position:sticky;top:12px;background:var(--bg);border:8px solid #101a40;border-radius:34px;overflow:hidden;box-shadow:0 10px 30px rgba(13,27,74,.18);max-width:392px;width:100%;margin-inline:auto}
:root[data-theme="dark"] .vista{border-color:#2a3470}
.vista .in{font-family:var(--ft);font-size:calc(15px*var(--escala));padding:16px 14px 20px;display:flex;flex-direction:column;gap:12px;max-height:760px;overflow:auto;scrollbar-width:none}
.vista h2{font-family:var(--fd);font-size:calc(26px*var(--escala)*var(--zt));line-height:1.1;letter-spacing:var(--ls,0)}
.v-sub{color:var(--ink2)}
.v-card{background:var(--acc);color:var(--acc-ink);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.v-card .n{font-family:var(--fd);font-size:calc(32px*var(--escala)*var(--zt));line-height:1}
.v-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v-tile{min-height:calc(var(--toque)*2);border-radius:22px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sombra);transition:transform .15s,box-shadow .15s}
.v-tile:active{transform:translateY(4px);box-shadow:var(--sombra-a)}
.v-tile i{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:22px}
.v-tile b{font-family:var(--fd);font-size:calc(17px*var(--escala)*var(--zt));font-weight:600;line-height:1.1;display:block}.v-tile small{opacity:.92;font-size:calc(12.5px*var(--escala))}
.v-fila{display:flex;align-items:center;gap:12px;min-height:var(--toque);padding:8px 12px;border-radius:18px;background:var(--surf);width:100%}
.v-fila .f{width:44px;height:44px;border-radius:14px;color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.v-fila b{display:block;line-height:1.15}.v-fila small{color:var(--ink2);font-size:calc(13px*var(--escala))}.v-fila .m{margin-left:auto;font-family:var(--fd);font-weight:600}
.v-btn{display:flex;align-items:center;justify-content:center;min-height:calc(var(--toque) + 4px);border-radius:16px;background:var(--acc);color:var(--acc-ink);font-family:var(--fd);font-size:calc(19px*var(--escala)*var(--zt));font-weight:600;box-shadow:var(--sombra-s);width:100%;transition:transform .12s,box-shadow .12s}
.v-btn:active{transform:translateY(3px);box-shadow:var(--sombra-a)}
.v-chips{display:flex;gap:8px;flex-wrap:wrap}.v-chips button{min-height:calc(var(--toque) - 12px);padding:0 16px;border-radius:99px;font-weight:800;color:#fff;box-shadow:var(--sombra-a)}
.v-step{display:flex;align-items:center;justify-content:center;gap:16px}.v-step button{width:calc(var(--toque) - 2px);height:calc(var(--toque) - 2px);border-radius:18px;background:var(--surf2);font-family:var(--fd);font-size:28px;text-align:center}
.v-step output{font-family:var(--fd);font-size:calc(40px*var(--escala)*var(--zt));min-width:60px;text-align:center}
.v-aparece{animation:sube calc(.5s*var(--mov)) both}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bob{animation:bob calc(2.2s*var(--mov)) ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.resumen{background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:12px 14px;font-weight:800}
.resumen code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;display:block;margin-top:6px;white-space:pre-wrap;color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:800}
.btn.sec{background:var(--surf2);color:var(--ink)}
[data-mov="0"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<main>
  <div class="top"><h1 class="titulo">Letra y controles</h1><button type="button" id="tema">Oscuro</button></div>
  <p class="lede">Elige cómo se lee y cómo se toca la app. A la derecha ves el resultado al instante en un Inicio de ejemplo. Lo que elijas quedará también en <b>Ajustes › Apariencia</b>, con estas mismas opciones.</p>
  <div class="grid">
    <div class="panel" id="panel"></div>
    <div>
      <div class="vista" id="vista"><div class="in">
        <div class="v-aparece"><h2>Hola, Marco</h2><p class="v-sub">¿Qué anotamos hoy?</p></div>
        <div class="v-card v-aparece" style="animation-delay:.05s"><div><small>Hoy llevas</small><div class="n">S/ 63.00</div></div><div style="margin-left:auto;text-align:right"><small>Pedidos</small><div class="n">6</div></div></div>
        <div class="v-tiles">
          <button type="button" class="v-tile v-aparece" style="background:var(--c1);animation-delay:.1s"><i>🧾</i><span><b>Leer una comanda</b><small>Foto de la hoja</small></span></button>
          <button type="button" class="v-tile v-aparece" style="background:var(--c2);animation-delay:.15s"><i>＃</i><span><b>Cuántos hice</b><small>Solo la cantidad</small></span></button>
          <button type="button" class="v-tile v-aparece" style="background:var(--c4);animation-delay:.2s"><i>🖼</i><span><b>Lista de fotos</b><small>Capturas de Órdenes</small></span></button>
          <button type="button" class="v-tile v-aparece" style="background:var(--c5);animation-delay:.25s"><i>🍷</i><span><b>Expo Vino</b><small>Por zonas</small></span></button>
        </div>
        <button type="button" class="v-fila v-aparece" style="animation-delay:.3s"><span class="f" style="background:var(--c1)">🏬</span><span><b>Pedidos de mi tienda</b><small>10 pedidos · 3 rutas</small></span><span class="m">S/ 99.00</span></button>
        <button type="button" class="v-fila v-aparece" style="animation-delay:.35s"><span class="f" style="background:var(--c5)">🍷</span><span><b>Expo Vino</b><small>San Borja × 5</small></span><span class="m">S/ 42.50</span></button>
        <div class="v-chips"><button type="button" style="background:var(--c2)">✓ Entregado</button><button type="button" style="background:var(--c3)">Parcial</button><button type="button" style="background:#6b7490">No entregado</button></div>
        <div class="v-step"><button type="button" aria-label="Menos">−</button><output>5</output><button type="button" aria-label="Más">+</button></div>
        <button type="button" class="v-btn">Anotar los pedidos</button>
      </div></div>
    </div>
  </div>
  <div class="panel" style="margin-top:18px"><h3>Mi elección</h3><div class="resumen" id="resumen"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn" id="copiar">Copiar mi elección</button><button type="button" class="btn sec" id="fabrica">Volver a lo de fábrica</button></div><p class="v-sub" id="aviso" role="status" style="min-height:1.4em"></p></div>
</main>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const FUENTES={
  tema:{n:'La de cada cara',s:'Cada cara usa la suya (Mapa: Unbounded + DM Sans)',fd:'"Unbounded","Trebuchet MS",system-ui,sans-serif',ft:'"DM Sans",system-ui,sans-serif',zt:.9},
  redondeada:{n:'Redondeada',s:'Fredoka + Nunito · amable',fd:'"Fredoka","Trebuchet MS",system-ui,sans-serif',ft:'"Nunito",system-ui,sans-serif',zt:1},
  clasica:{n:'Clásica',s:'Lora + DM Sans · con serifa en los títulos',fd:'"Lora",Georgia,serif',ft:'"DM Sans",system-ui,sans-serif',zt:1},
  moderna:{n:'Moderna',s:'Space Grotesk + Inter · técnica y limpia',fd:'"Space Grotesk","Inter",system-ui,sans-serif',ft:'"Inter",system-ui,sans-serif',zt:1},
  condensada:{n:'Condensada',s:'Barlow Condensed + Barlow · cabe más texto',fd:'"Barlow Condensed","Barlow",system-ui,sans-serif',ft:'"Barlow",system-ui,sans-serif',zt:1.14},
  amigable:{n:'Amigable',s:'Bricolage Grotesque + Figtree · con personalidad',fd:'"Bricolage Grotesque","Figtree",system-ui,sans-serif',ft:'"Figtree",system-ui,sans-serif',zt:1},
  legible:{n:'Muy legible',s:'Manrope + Inter · espaciada, para leer al sol',fd:'"Manrope","Inter",system-ui,sans-serif',ft:'"Inter",system-ui,sans-serif',zt:1,ls:'.01em'}
};
const GRUPOS=[
  {k:'letra',t:'Tipo de letra',s:'Cada opción está escrita con su propia letra.',cls:'',ops:Object.entries(FUENTES).map(([v,f])=>[v,f.n,f.s,f])},
  {k:'tamano',t:'Tamaño de la letra',s:'Todo el texto de la app crece o se achica.',cls:'tres',ops:[['normal','Normal',''],['grande','Grande',''],['muy-grande','Muy grande','']]},
  {k:'botones',t:'Botones',s:'Con relieve se hunden al tocarlos; planos son más discretos.',cls:'dos',ops:[['relieve','Con relieve',''],['plano','Planos','']]},
  {k:'toques',t:'Toques',s:'Qué tan altos son los botones y las filas.',cls:'dos',ops:[['comodo','Cómodos','Para el dedo con guante'],['compacto','Compactos','Cabe más en pantalla']]},
  {k:'anim',t:'Animaciones',s:'Entradas, conteos, el auto y el confeti.',cls:'dos',ops:[['completa','Completas',''],['reducida','Reducidas','Casi sin movimiento']]}
];
const FABRICA={letra:'tema',tamano:'normal',botones:'relieve',toques:'comodo',anim:'completa'};
let est={...FABRICA};
try{const g=JSON.parse(localStorage.getItem('cd.visual')||'null');if(g)est={...FABRICA,...g}}catch(_){}
function aplicar(){
  const r=document.documentElement.style,f=FUENTES[est.letra]||FUENTES.tema;
  r.setProperty('--fd',f.fd);r.setProperty('--ft',f.ft);r.setProperty('--zt',f.zt);r.setProperty('--ls',f.ls||'0');
  r.setProperty('--escala',{normal:1,grande:1.12,'muy-grande':1.25}[est.tamano]);
  r.setProperty('--toque',est.toques==='compacto'?'46px':'56px');
  const rel=est.botones==='relieve';
  r.setProperty('--sombra',rel?'0 6px 0 rgba(0,0,0,.18)':'none');r.setProperty('--sombra-s',rel?'0 4px 0 rgba(0,0,0,.18)':'none');r.setProperty('--sombra-a',rel?'0 2px 0 rgba(0,0,0,.18)':'none');
  document.documentElement.dataset.mov=est.anim==='reducida'?'0':'1';r.setProperty('--mov',est.anim==='reducida'?'0.001':'1');
  try{localStorage.setItem('cd.visual',JSON.stringify(est))}catch(_){}
  $('#resumen').innerHTML=`Tu elección:<code>Letra: ${(FUENTES[est.letra]||{}).n} · Tamaño: ${{normal:'Normal',grande:'Grande','muy-grande':'Muy grande'}[est.tamano]}\nBotones: ${rel?'Con relieve':'Planos'} · Toques: ${est.toques==='comodo'?'Cómodos':'Compactos'} · Animaciones: ${est.anim==='completa'?'Completas':'Reducidas'}</code>`;
  $$('.op').forEach(b=>b.setAttribute('aria-checked',est[b.dataset.k]===b.dataset.v));
}
function $$(s){return[...document.querySelectorAll(s)]}
$('#panel').innerHTML=GRUPOS.map(g=>`<div class="grupo"><h3>${g.t}</h3><small>${g.s}</small><div class="opciones ${g.cls}" role="radiogroup" aria-label="${g.t}">${g.ops.map(([v,n,s,f])=>`<button type="button" role="radio" class="op" data-k="${g.k}" data-v="${v}" aria-checked="false"><span><b ${f?`style="font-family:${f.fd}"`:''}>${n}</b>${s?`<small ${f?`style="font-family:${f.ft}"`:''}>${s}</small>`:''}</span></button>`).join('')}</div></div>`).join('');
$('#panel').addEventListener('click',e=>{const b=e.target.closest('.op');if(!b)return;est[b.dataset.k]=b.dataset.v;aplicar()});
$('#fabrica').onclick=()=>{est={...FABRICA};aplicar();$('#aviso').textContent='Listo: todo vuelve a lo de fábrica.'};
$('#copiar').onclick=()=>{const t=$('#resumen code').textContent;const ok=()=>{$('#aviso').textContent='Copiado. Pégamelo y lo dejo así por defecto.'};try{navigator.clipboard.writeText(t).then(ok,()=>{$('#aviso').textContent='Selecciona el recuadro verde y cópialo a mano.'})}catch(_){$('#aviso').textContent='Selecciona el recuadro verde y cópialo a mano.'}};
$('#tema').onclick=()=>{const d=document.documentElement,o=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',o?'light':'dark');$('#tema').textContent=o?'Oscuro':'Claro'};
aplicar();
})();
</script>
