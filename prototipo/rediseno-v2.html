<title>Control Driver v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Lenguaje: una acción = un color + una figura. Botones grandes y rellenos, texto corto, movimiento suave. */
:root{
  --bg:#eef2fb; --surf:#ffffff; --surf2:#e6ecfc; --ink:#0d1b4a; --ink2:#4a5780; --ink3:#78839f; --line:#d6def2;
  --acc:#1f5cff; --acc-ink:#fff; --acc-soft:#dce6ff; --sun:#ffc800; --sun-ink:#0a2260;
  --ok:#0c7d3c; --ok-soft:#dff5e6; --warn:#b85a00; --warn-soft:#fff0d6; --bad:#c42b21; --bad-soft:#fde3e1;
  --c-comanda:#1f5cff; --c-cantidad:#0c7d3c; --c-mano:#b85a00; --c-foto:#7a3ff2; --c-adic:#a3274f; --c-apoyo:#07727c; --c-taxi:#ffc800;
  --c-pagos:#0c7d3c; --c-stats:#6a3fd6; --c-ajustes:#4a5780; --c-buscar:#0f6fb0; --c-historial:#8a5a00; --c-aprender:#d1498a; --c-licencia:#0a2260;
  --shadow:0 10px 30px rgba(13,27,74,.14);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-cara="menta"]{--acc:#0c8f6a;--acc-soft:#d3f3e8;--bg:#eefaf5;--surf2:#dcf2e9;--c-comanda:#0c8f6a;--ink:#0b2e25;--ink2:#41635a;--line:#cfe8de}
:root[data-cara="violeta"]{--acc:#6a3fd6;--acc-soft:#e6dcff;--bg:#f3effd;--surf2:#e8e0fb;--c-comanda:#6a3fd6;--ink:#241048;--ink2:#5b4a85;--line:#ddd2f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1130; --surf:#141c44; --surf2:#1e2858; --ink:#eef1ff; --ink2:#b7c0e6; --ink3:#8a94c4; --line:#2a3470;
  --acc:#6d93ff; --acc-ink:#0a1130; --acc-soft:#223067; --ok:#4fd28a; --ok-soft:#14382a; --warn:#ffb25a; --warn-soft:#3d2c10; --bad:#ff8a80; --bad-soft:#471c1a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1130; --surf:#141c44; --surf2:#1e2858; --ink:#eef1ff; --ink2:#b7c0e6; --ink3:#8a94c4; --line:#2a3470;
  --acc:#6d93ff; --acc-ink:#0a1130; --acc-soft:#223067; --ok:#4fd28a; --ok-soft:#14382a; --warn:#ffb25a; --warn-soft:#3d2c10; --bad:#ff8a80; --bad-soft:#471c1a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{max-width:1180px;margin:0 auto;padding-block:18px 56px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0} button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,4.5vw,34px)} .lede{color:var(--ink2);max-width:70ch;margin-top:6px}
.caras{display:flex;gap:6px;margin-left:auto}
.caras button,.toggle-tema{padding:8px 14px;border-radius:99px;background:var(--surf);border:2px solid var(--line);font-weight:800;font-size:13px}
.caras button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.stage{display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:26px;align-items:start;margin-top:16px}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.lado{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:14px}
.panel h3{font-size:18px;margin-bottom:8px}
.panel ul{margin:6px 0 0;padding-left:18px;color:var(--ink2)} .panel li{margin:4px 0}
.indice{display:flex;flex-wrap:wrap;gap:6px}
.indice b{flex-basis:100%;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.indice button{padding:7px 12px;border-radius:99px;background:var(--surf2);font-weight:800;font-size:13px;transition:transform .12s}
.indice button:hover{transform:translateY(-2px)} .indice button[aria-current=true]{background:var(--acc);color:var(--acc-ink)}
.recorridos{display:grid;gap:6px}
.recorridos button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surf2);font-weight:800;text-align:left}
.recorridos button i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:13px;flex:none}

/* ---------- teléfono ---------- */
.phone{position:relative;width:100%;max-width:392px;height:800px;margin-inline:auto;background:var(--bg);border:8px solid #101a40;border-radius:38px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;isolation:isolate}
:root[data-theme="dark"] .phone{border-color:#2a3470}
.status{display:flex;justify-content:space-between;padding:9px 18px 2px;font-size:12px;font-weight:800;color:var(--ink2);flex:none}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;font-family:var(--f-display);font-weight:600;flex:none}
.appbar .atras{width:40px;height:40px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;margin-left:-6px}
.appbar .pildora{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.appbar .pildora .ic{width:16px;height:16px}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 104px;scrollbar-width:none;scroll-behavior:smooth}
.screen::-webkit-scrollbar,.hoja-cuerpo::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 4px 10px;background:var(--surf);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(13,27,74,.12);z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--ink3);padding:6px 8px;border-radius:14px;min-width:56px;transition:transform .12s}
.nav button:active{transform:scale(.92)} .nav .ic{width:24px;height:24px}
.nav button.on{background:var(--sun);color:var(--sun-ink)}
.nav button.cargar{position:relative;top:-16px;width:64px;height:64px;min-width:64px;border-radius:50%;background:var(--acc);color:var(--acc-ink);box-shadow:0 7px 0 rgba(0,0,0,.2),0 0 0 5px var(--surf);justify-content:center;padding:0}
.nav button.cargar .ic{width:28px;height:28px}
.nav button.cargar span{font-size:10px}
.capa{position:absolute;inset:0;background:rgba(5,10,40,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.capa.on{opacity:1;pointer-events:auto}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surf);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1.04);z-index:21;display:flex;flex-direction:column;overflow:hidden}
.hoja.on{transform:none} .hoja.full{top:24px;max-height:none}
.hoja-cab{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;flex:none}
.hoja-cab.claro{color:var(--sun-ink)} .hoja-cab.neutro{color:var(--ink);background:var(--surf)}
.hoja-cab .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.hoja-cab.claro .ico{background:rgba(10,34,96,.12)} .hoja-cab.neutro .ico{background:var(--acc-soft);color:var(--acc)}
.hoja-cab .ico .ic{width:26px;height:26px}
.hoja-cab h3{font-size:20px;line-height:1.1} .hoja-cab small{opacity:.9;font-weight:700;display:block}
.hoja-cab .x{margin-left:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.hoja-cab.neutro .x{background:var(--surf2)} .hoja-cab.claro .x{background:rgba(10,34,96,.12)}
.hoja-cuerpo{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;scrollbar-width:none}
.hoja-pie{padding:10px 16px 14px;border-top:2px solid var(--line);display:flex;gap:8px;flex:none;background:var(--surf)}
.toast{position:absolute;left:50%;top:78px;transform:translate(-50%,-30px) scale(.9);opacity:0;background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:60;transition:all .3s cubic-bezier(.2,.9,.3,1.3);max-width:88%;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;top:42%;left:50%;z-index:70;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- biblioteca de componentes (úsalos) ---------- */
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(31,92,255,.45)}100%{box-shadow:0 0 0 16px rgba(31,92,255,0)}}
@keyframes trazo{to{stroke-dashoffset:0}}
@keyframes girar{to{transform:rotate(360deg)}}
.rise{animation:rise .45s both} .pop{animation:pop .3s both} .bob{animation:bob 2.2s ease-in-out infinite}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:16px;transition:transform .12s,filter .12s;box-shadow:0 5px 0 rgba(0,0,0,.18);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sm{min-height:42px;font-size:14px;padding:0 14px;width:auto;box-shadow:0 3px 0 rgba(0,0,0,.16)}
.btn.sec{background:var(--surf2);color:var(--ink);box-shadow:none} .btn.ghost{background:none;color:var(--acc);box-shadow:none;border:3px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff} .btn.ok{background:var(--ok);color:#fff} .btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.auto{width:auto} .btn.dis,.btn:disabled{opacity:.45;pointer-events:none}
.fila{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;background:var(--surf);text-align:left;transition:transform .12s;min-height:60px}
.fila:active{transform:scale(.98)} .fila + .fila{margin-top:8px}
.fila .fig{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.fila .fig .ic{width:24px;height:24px} .fila .fig.claro{color:var(--sun-ink)}
.fila b{display:block;line-height:1.15} .fila small{display:block;color:var(--ink2);font-weight:700}
.fila .der{margin-left:auto;text-align:right;font-family:var(--f-display);font-weight:600;white-space:nowrap}
.fila .ic.flecha{margin-left:auto;color:var(--ink3);width:18px;height:18px}
.tile{position:relative;min-height:110px;border-radius:22px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 rgba(0,0,0,.18);overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .fig{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.tile b{font:600 17px/1.1 var(--f-display);display:block} .tile small{opacity:.92;font-weight:700;font-size:12.5px}
.tile.claro{color:var(--sun-ink)} .tile.claro .fig{background:rgba(10,34,96,.12)}
.tile .brillo{position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile[aria-pressed=true]{outline:4px solid var(--ink);outline-offset:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:99px;background:var(--surf2);color:var(--ink);font-weight:800;border:3px solid transparent;transition:transform .12s}
.chip:active{transform:scale(.94)} .chip[aria-pressed=true]{border-color:var(--ink);background:var(--surf)}
.chip.col{color:#fff} .chip.col[aria-pressed=true]{border-color:var(--ink)} .chip.sun{background:var(--sun);color:var(--sun-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--surf2)}
.seg button{flex:1;min-height:42px;border-radius:14px;font-weight:800;color:var(--ink2);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.seg button[aria-selected=true]{background:var(--surf);color:var(--ink);box-shadow:0 2px 6px rgba(13,27,74,.15)}
.seg button .n{font-size:12px;background:var(--acc-soft);color:var(--acc);border-radius:99px;padding:0 7px}
.opt{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--surf);font-weight:800;width:100%;transition:transform .12s,border-color .15s,background .15s}
.opt:active{transform:scale(.97)} .opt small{display:block;color:var(--ink3);font-weight:700}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.opt[aria-pressed=true]::after{content:"✓";margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:15px;animation:pop .3s}
.card{background:var(--surf);border-radius:20px;padding:14px} .card.hero{background:var(--acc);color:var(--acc-ink)}
.card h3{font-size:18px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.sol{color:#fff} .pill .ic{width:13px;height:13px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--acc-soft);font-weight:700;font-size:14px}
.aviso.warn{background:var(--warn-soft);color:var(--warn)} .aviso.bad{background:var(--bad-soft);color:var(--bad)} .aviso.ok{background:var(--ok-soft);color:var(--ok)}
.aviso .ic{margin-top:1px}
.ac{background:var(--surf);border-radius:20px;overflow:hidden}
.ac + .ac{margin-top:10px}
.ac-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px;min-height:64px}
.ac-h .fig{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.ac-h .fig.claro{color:var(--sun-ink)}
.ac-h b{display:block;line-height:1.15} .ac-h small{display:block;color:var(--ink2);font-weight:700}
.ac-h .der{margin-left:auto;font-family:var(--f-display);font-weight:600;white-space:nowrap}
.ac-h .chev{margin-left:8px;transition:transform .25s;color:var(--ink3);width:18px;height:18px}
.ac.open .ac-h .chev{transform:rotate(180deg)}
.ac-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.ac.open .ac-b{grid-template-rows:1fr} .ac-b>div{overflow:hidden}
.ac-b .in{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;font-weight:800;color:var(--ink2);display:block;margin-bottom:6px}
.inp{width:100%;min-height:52px;border-radius:14px;border:3px solid var(--line);background:var(--surf);padding:0 14px;font:800 17px var(--f-body);color:var(--ink)}
.inp:focus{border-color:var(--acc);outline:0} textarea.inp{padding:12px 14px;min-height:92px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:54px;height:54px;border-radius:18px;background:var(--surf2);font:600 28px var(--f-display);text-align:center;transition:transform .1s}
.stepper button:active{transform:scale(.9)} .stepper output{min-width:64px;text-align:center;font:600 42px var(--f-display)}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:var(--line);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw[aria-checked=true]{background:var(--ok)} .sw[aria-checked=true]::after{transform:translateX(22px)}
.kpi{display:flex;flex-direction:column;border-radius:16px;background:var(--surf2);padding:10px 8px;text-align:center}
.kpi b{font:600 24px/1.05 var(--f-display)} .kpi small{font-size:11.5px;font-weight:800;color:var(--ink2)}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,monospace} .num{font-family:var(--f-display);font-weight:600}
.sep{height:2px;background:var(--line);border-radius:1px;margin:2px 0}
.titulo-s{font:600 20px var(--f-display);margin:14px 2px 8px}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink3);font-weight:700}
.barra{height:10px;border-radius:5px;background:var(--surf2);overflow:hidden} .barra i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.dots{display:flex;gap:6px;justify-content:center} .dots i{width:9px;height:9px;border-radius:50%;background:var(--surf2)} .dots i.on{width:26px;border-radius:5px;background:var(--acc)}
.carro{animation:bob 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<main>
  <div class="top">
    <h1>Control Driver, más simple y de colores</h1>
    <div class="caras" id="caras" aria-label="Cara de la app"><button type="button" data-c="mapa" aria-pressed="true">Mapa</button><button type="button" data-c="menta" aria-pressed="false">Menta</button><button type="button" data-c="violeta" aria-pressed="false">Violeta</button><button type="button" class="toggle-tema" id="tema">Oscuro</button></div>
  </div>
  <p class="lede">Prototipo con todas las pantallas de la app. Navega como en el teléfono: la barra de abajo, los botones, las hojas que suben. A la derecha ves qué cambia en cada pantalla y puedes saltar a cualquiera.</p>
  <div class="stage">
    <div class="phone" id="phone" aria-label="Teléfono de prueba">
      <div class="status"><span>10:24</span><span>5G ▮▮▮ 72%</span></div>
      <div class="appbar" id="appbar"></div>
      <div class="screen" id="screen"></div>
      <div class="nav" id="nav">

    return `<button type="button" class="fila ${o.cls||''}" ${o.a||''}><span class="fig ${claro?'claro':''}" style="background:${c}">${I(ic)}</span><span><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:''}</span>${o.der?`<span class="der">${o.der}</span>`:''}${o.flecha!==false&&!o.der?I('fwd','flecha'):''}</button>`},

    return `<div class="ac ${o.open?'open':''}" data-acid="${o.id||''}"><button type="button" class="ac-h" data-open aria-expanded="${!!o.open}"><span class="fig ${(o.claro||a.claro)?'claro':''}" style="background:${c}">${I(ic)}</span><span><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:''}</span>${o.der?`<span class="der">${o.der}</span>`:''}${I('chev','chev')}</button><div class="ac-b"><div><div class="in">${o.body||''}</div></div></div></div>`},

  sw(on,a=''){return `<button type="button" class="sw" role="switch" aria-checked="${!!on}" ${a}></button>`},

    return `<div style="position:relative;width:${size}px;height:${size}px;margin:auto"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke-width="${w}" style="stroke:var(--surf2)"/>${seg.map(x=>{const l=x.m/tot*C,o=-acc;acc+=l;return `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke-width="${w}" stroke-linecap="butt" style="stroke:${x.c};stroke-dasharray:${Math.max(l-3,0)} ${C};stroke-dashoffset:${o};transition:stroke-dasharray .6s"/>`}).join('')}</svg><div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center">${centro}</div></div>`},

  /* contador animado */
  count(el,to,f=fmt.sol,from=0){if(reducir){el.textContent=f(to);return}const t0=performance.now(),d=650;(function s(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(s)})(t0)}
};

/* ---------- eventos delegados (un solo lugar) ---------- */
document.addEventListener('click',e=>{

  if(!t||!t.closest('#phone,#indice,#recorridos'))return;
  const P=()=>{try{return JSON.parse(t.dataset.p||'{}')}catch(_){return{}}};
  if(t.dataset.go){App.go(t.dataset.go,P())}

  if(t.hasAttribute('data-tog')){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true')}
  if(t.hasAttribute('data-sw')){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')}
  if(t.dataset.step){const o=document.getElementById(t.dataset.for);if(o)o.textContent=Math.max(0,(+o.textContent||0)+ +t.dataset.step)}
  if(t.dataset.tab){const c=t.closest('#hoja')&&App.sheetCtx?App.sheetCtx:App.ctxOf(App.cur());c.s[t.dataset.tab]=t.dataset.v;App.refresh()}
  if(t.dataset.act&&!t.dataset.tab)App.act(t,e);
});

const acx=(ctx,o)=>UI.ac(Object.assign({open:!!(ctx.s.op&&ctx.s.op[o.id])},o));
const chipsDia=(sel)=>`<div class="chips">${NOM3.slice(0,HOY+1).map((n,i)=>UI.chip(fechaC(i),i===sel,`data-one data-d="${i}"`)).join('')}</div>`;

/* ---------- DetalleDelDia ---------- */
function filaPed(x,d){
  const p=x.p,est=p.e,cls=est==='E'?'ok':est==='P'?'warn':'nd',ic=est==='E'?'check':est==='P'?'warn':'x';
  const r=p.r!=null?rutas(d).find(q=>q.n===p.r):null;
  const rp=r?UI.pill(`Ruta ${r.n} · ${r.h}`,'acc','route'):p.r!=null?UI.pill(`Ruta ${p.r}`,'acc','route'):UI.pill('Sin ruta · toca para asignar','warn');
  const code=/^pendiente/.test(p.c)?`<b class="ini-sc">Pedido sin código · toca para completar</b>`:`<b class="mono">${esc(p.c)}</b>`;
  return `<button type="button" class="ini-ped ${cls}" data-sheet="pedido" data-p='${pj(x.ref)}'><span class="ini-pe">${I(ic)}</span><span class="ini-pm">${code}<span class="ini-pp">${UI.pill(DATA.estado[est][0],DATA.estado[est][1])}${rp}${p.z?UI.pill(esc(p.z),'','pin'):''}${p.mano?UI.pill('a mano'):''}</span><span class="ini-pi">${p.cli?I('user'):''}${p.foto?I('foto'):''}</span></span><span class="num">${fmt.sol(mon(p))}</span></button>`;
}
function detalle(ctx,d,R){
  const s=ctx.s,tab=s.dtab||'ped',rs=rutas(d),L=R.L;
  let h=UI.seg('dtab',[['ped','Pedidos',R.n],['zona','Por zona'],['rut','Rutas',rs.length]],tab);
  if(tab==='ped'){
    const mostrar=s.todos?L:L.slice(0,5);
    h+=mostrar.map(x=>filaPed(x,d)).join('');
    if(R.ex)h+=UI.aviso(`${R.ex} pedido${R.ex>1?'s':''} más, anotado${R.ex>1?'s':''} solo por cantidad`,'');
    if(L.length>5)h+=`<button type="button" class="btn sec sm" style="width:100%" data-act="vertodos">${I(s.todos?'chev':'list')}${s.todos?'Ver menos':`Ver los ${R.n} pedidos`}</button>`;
    if(!L.length&&!R.ex)h+=UI.aviso('Todavía no hay pedidos este día','');
  }else if(tab==='zona'){
    const g=[0,1,2].map(k=>({k,n:L.filter(x=>grupoZona(x.p)===k).length,m:sum(L.filter(x=>grupoZona(x.p)===k),x=>mon(x.p))})).filter(x=>x.n);
    const mx=Math.max(1,...g.map(x=>x.m));
    h+=g.map(x=>`<div class="ini-zona"><div><span>${ZNOM[x.k]} · ${x.n}</span><span class="num">${fmt.sol(x.m)}</span></div><div class="barra"><i style="width:${Math.max(6,x.m/mx*100)}%;background:${ZCOL[x.k]}"></i></div></div>`).join('')||UI.aviso('Sin pedidos para agrupar','');
  }else{
    h+=rs.map(r=>{
      const n=L.filter(x=>x.p.r===r.n).length;
      if(s.confR===r.n)return `<div class="ini-ruta">${UI.aviso(`¿Quitar la ruta ${r.n}? Sus pedidos no se borran.`,'warn')}<div class="grid2" style="margin-top:8px"><button type="button" class="btn bad sm" style="width:100%" data-act="rutok">${I('trash')}Quitar</button><button type="button" class="btn sec sm" style="width:100%" data-act="rutno">Dejarla</button></div></div>`;
      return `<div class="ini-ruta"><div class="ini-rh"><span class="ini-rn">${r.n}</span><div><b>Ruta ${r.n} · ${r.h} – ${r.fin}</b><small>${n} pedido${n===1?'':'s'}</small></div><button type="button" class="ini-x" data-act="rutq" data-n="${r.n}" aria-label="Quitar ruta ${r.n}">${I('x')}</button></div><div class="ini-via"><span class="ini-st a">${I('store')}</span>${Array.from({length:n},()=>`<span class="ini-ln"></span><span class="ini-st"></span>`).join('')}<span class="ini-ln"></span><span class="ini-st z">${I('flag')}</span></div></div>`}).join('')||UI.aviso('Este día no tiene rutas','');
    h+=`<button type="button" class="btn sec sm" style="width:100%" data-sheet="rutas-hoja">${I('plus')}Añadir ruta</button>`;
  }
  /* pie de tres botones */
  const hr=HORA[d]||(HORA[d]={i:'08:00',o:'16:30'});
  let hor='';
  if(s.op&&s.op.horario){
    const ini=rs.length?Math.min(...rs.map(r=>tmin(r.h))):0,fin=rs.length?Math.max(...rs.map(r=>tmin(r.fin))):0,pe=tmin(hr.o)-tmin(hr.i),pd=fin-ini,mxx=Math.max(pe,pd,1);
    hor=`<div class="ini-hor"><div class="g"><div><label class="lbl" for="ini-hin">Entrada</label><input id="ini-hin" class="inp" type="time" value="${hr.i}"></div><div><label class="lbl" for="ini-hout">Salida</label><input id="ini-hout" class="inp" type="time" value="${hr.o}"></div></div>
    <button type="button" class="btn sm" style="width:100%;background:var(--c-historial)" data-act="guardahor">${I('check')}Guardar horario</button>
    ${rs.length&&pe>0?`<div class="ini-cmp"><div><span>En tienda</span><div class="barra"><i style="width:${pe/mxx*100}%;background:var(--c-historial)"></i></div><span>${dur(pe)}</span></div><div><span>Pedidos</span><div class="barra"><i style="width:${pd/mxx*100}%;background:var(--acc)"></i></div><span>${dur(pd)}</span></div></div>${pd>pe?UI.aviso('Tus pedidos duran más que tu horario. Revisa la entrada o la salida.','warn'):UI.aviso(`Estuviste ${dur(pe-pd)} en tienda sin salir a reparto.`,'ok')}`:UI.aviso('Pon el horario y las rutas del día para comparar.','')}</div>`;
  }
  h+=`<div class="ini-pie"><button type="button" class="btn" style="background:var(--c-foto)" data-sheet="visor-foto">${I('foto')}Capturas y fotos del día</button><button type="button" class="btn" style="background:var(--c-historial)" data-act="hor">${I('clock')}Horario en tienda</button>${hor}`;
  h+=s.confBorrar?`<div class="ini-ruta">${UI.aviso('¿Borrar todo este día? Pedidos, rutas, adicionales y apoyo se quitan.','bad')}<div class="grid2" style="margin-top:8px"><button type="button" class="btn bad sm" style="width:100%" data-act="borrarok">${I('trash')}Sí, borrar</button><button type="button" class="btn sec sm" style="width:100%" data-act="borrarno">No</button></div></div>`:`<button type="button" class="btn bad" data-act="borrar">${I('trash')}Borrar este día</button>`;
  return h+'</div>';
}

App.screen('inicio',{titulo:'Hoy',icono:'home',tab:'inicio',
  cambios:['«Volver a hoy» y el calendario son botones, no enlaces; lo de «mantén presionado» se cambió por un botón ⋯ visible','Tira de 7 días de color: verde cargado, luna descanso, anillo que late en hoy','Todo el resumen en una tarjeta viva con anillo; tocar una leyenda abre su fila','Sin botón + flotante: «Cargar» ya está en la barra de abajo','Día vacío con dibujo y tres botones grandes en vez de texto suelto'],
  render(ctx){
    const s=ctx.s;s.op=s.op||{};
    const fr=!(s._last&&Date.now()-s._last<1500);s._last=Date.now();
    const rc=n=>fr?`rise d${n}`:'';
    const d=SEL,es=estadoDia(d),R=resumen(d),esHoy=d===HOY;
    const nCar=[0,1,2,3,4,5,6].filter(i=>i<=HOY&&!DESC.has(i)&&resumen(i).datos).length;
    let h=`<div class="ini-cab ${rc(1)}"><div><h2 class="ini-fecha">${fechaL(d)}</h2><p class="muted">${DATA.hoy.semana} · ${nCar} de 7 días</p></div><div class="ini-cab-b">${esHoy?'':`<button type="button" class="ini-volver" data-act="hoy">${I('history')}Volver a hoy</button>`}<button type="button" class="ini-icb" data-toast="Calendario: elige otro día en la tira" aria-label="Calendario">${I('cal')}</button></div></div>`;
    h+=`<div class="ini-tira ${rc(2)}" role="group" aria-label="Días de la semana">${DATA.hoy.dias.map((x,i)=>{const e=estadoDia(i);return `<button type="button" class="ini-dia ${e} ${i===HOY?'hoy':''}" aria-pressed="${i===d}" data-act="dia" data-i="${i}" aria-label="${fechaL(i)}"><small>${x.d}</small><b>${x.n}</b><span class="ini-mk">${e==='descanso'?I('moon'):(e==='cargado'||(i===HOY&&resumen(i).datos)?'<i class="ini-pt"></i>':'')}</span></button>`}).join('')}</div>`;
    h+=`<div class="ini-sub ${rc(2)}"><small>${esHoy?'Hoy':fechaC(d)} · toca un día para verlo</small><button type="button" class="ini-icb" data-sheet="dia" data-p='{"i":${d}}' aria-label="Opciones de este día">${I('dots')}</button></div>`;
    if(App.state.licencia==='vencida')h+=`<div class="ini-lic ${rc(3)}"><div><span class="fig">${I('key')}</span><div><b>Tu prueba terminó</b><small>Puedes ver todo; para cargar, activa tu licencia</small></div></div>${UI.btn({t:'Activar mi licencia',i:'key',c:'var(--c-licencia)',cls:'sm',a:'data-go="ajustes" data-p=\'{"abre":"licencia"}\' style="width:100%"'})}</div>`;

    if(es==='descanso'){
      h+=`<div class="ini-vacio ${rc(3)}">${ilus.luna()}<h3>Día de descanso</h3><p>Hoy no se cuenta. Descansar también es trabajo.</p><button type="button" class="btn sec" data-act="quitardesc">${I('refresh')}Quitar el descanso</button></div>`;
    }else if(es==='futuro'){
      h+=`<div class="ini-vacio ${rc(3)}">${ilus.futuro()}<h3>Ese día todavía no llega</h3><p>Cuando llegue, aquí vas a cargar tus pedidos.</p><button type="button" class="btn" data-act="hoy">${I('history')}Volver a hoy</button></div>`;
    }else if(es==='vacio'){
      h+=`<div class="ini-vacio ${rc(3)}">${ilus.vacio()}<h3>${esHoy?'Hoy: sin cargar':'Este día: sin cargar'}</h3><p>Sube el resumen o toma una foto de la comanda.</p>
        <button type="button" class="btn" data-sheet="cargar">${I('cargar')}Cargar resumen del día</button>
        <button type="button" class="btn" style="background:var(--c-comanda)" data-sheet="comandas">${I('camara')}Tomar foto de una comanda</button>
        <button type="button" class="btn ghost" data-act="desc">${I('moon')}No trabajé este día</button></div>`;
    }else{
      const rec=R.tot>=15000,rr=racha(d),from=fr?0:LAST.tot;
      const fu=[{k:'tienda',n:'Mi tienda',m:R.tienda,c:'var(--acc)'},{k:'apoyo',n:'Apoyo',m:R.apo,c:'var(--c-apoyo)'},{k:'adic',n:'Adicionales',m:R.adi,c:'var(--c-adic)'}];
      h+=`<section class="ini-hero ${rc(3)}"><div class="ini-ht"><span>${esHoy?'Hoy cargaste':'Ese día cargaste'}</span>${rec?`<span class="ini-ch rec">${I('star')}¡Récord!</span>`:''}${rr>=2?`<span class="ini-ch">${I('fire')}${rr} días</span>`:''}</div>
        <b class="ini-tot" data-count="${R.tot}" data-from="${from}">${fmt.sol(from)}</b><p>${R.n} pedido${R.n===1?'':'s'} · ${rutas(d).length} ruta${rutas(d).length===1?'':'s'}</p>
        <div class="ini-road"><span class="ini-car">${CAR(46)}</span></div>
        <div class="ini-anillo">${UI.ring(fu.filter(x=>x.m>0).map(x=>({m:x.m,c:x.c})),`<div class="ini-c"><b>${fmt.sol(R.tot)}</b><small>Total del día</small></div>`,164,20)}
        <div class="ini-leg">${fu.map(x=>`<button type="button" class="ini-lg ${x.m?'':'cero'}" data-act="leg" data-k="${x.k}"><i style="background:${x.c}"></i><b>${x.n}</b><span>${x.m?fmt.sol(x.m):'—'}</span>${I('fwd')}</button>`).join('')}</div></div></section>`;
      h+=`<h3 class="titulo-s ${rc(4)}">¿Qué hiciste ${esHoy?'hoy':'ese día'}?</h3><div class="${rc(4)}">`;
      const nCli=R.L.filter(x=>x.p.cli).length,tr=sum(rutas(d),r=>Math.max(0,tmin(r.fin)-tmin(r.h)));
      h+=acx(ctx,{id:'tienda',k:'tienda',t:'Pedidos de mi tienda',s:R.n?`${R.n} pedidos · ${rutas(d).length} rutas${tr?` · ${dur(tr)} en ruta`:''}${nCli?` · ${nCli} con cliente`:''}`:'Toca para anotarlos',der:R.n?`${fmt.sol(R.tienda)} <span class="ini-ck">${I('check')}</span>`:'',body:R.n?detalle(ctx,d,R):`${UI.aviso('Aún no anotaste pedidos de tu tienda este día.','')}<button type="button" class="btn" data-sheet="subirmas">${I('plus')}Anotar pedidos</button>`});
      const ap=apoy(d);
      h+=acx(ctx,{id:'apoyo',k:'apoyo',t:'Apoyé a otra tienda',s:ap.length?ap.map(a=>`${a.tienda} · ${a.det}`).join(' · '):'Toca para anotarlo',der:ap.length?`${fmt.sol(R.apo)} <span class="ini-ck">${I('check')}</span>`:'',body:`${ap.map(a=>`<div class="ini-line"><span>${esc(a.tienda)}<br><small class="tiny">${esc(a.det)}</small></span><b>${fmt.sol(a.m)}</b></div>`).join('')}<button type="button" class="btn sm" style="background:var(--c-apoyo);width:100%" data-sheet="apoyo">${I('plus')}${ap.length?'Agregar otro apoyo':'Anotar apoyo'}</button>`});

      tipos.forEach(t=>{const it=ad.filter(a=>a.tipo===t),k=t==='Taxi'?'taxi':'adicional';
        h+=acx(ctx,{id:'adic-'+slug(t),k,t:t==='Taxi'?'Hice taxi':t,s:it.map(a=>a.det).join(' · '),claro:k==='taxi',der:`${fmt.sol(sum(it,a=>a.m))} <span class="ini-ck">${I('check')}</span>`,body:`${it.map(a=>`<div class="ini-line"><span>${esc(a.det)}</span><b>${fmt.sol(a.m)}</b></div>`).join('')}<button type="button" class="btn sm" style="width:100%;background:${ACC[k].c}${k==='taxi'?';color:var(--sun-ink)':''}" data-sheet="adicional" data-p='{"tipo":"${t}"}'>${I('plus')}Agregar otro de ${t}</button>`})});
      if(!tipos.length)h+=`<div style="margin-top:10px">${UI.fila({k:'adicional',t:'Agregar un adicional',s:'Taxi, Expo Vino…',a:'data-sheet="adicional"'})}</div>`;
      h+='</div>';
      if(!s.noresp)h+=`<div class="ini-resp ${rc(5)}">${ilus.nube()}<div><b>Todavía no has hecho ningún respaldo</b><small>Guarda tus datos para no perderlos.</small><button type="button" class="btn sm" style="width:100%" data-go="ajustes" data-p='{"abre":"respaldo"}'>${I('nube')}Respaldar ahora</button></div><button type="button" class="ini-icb" style="background:var(--surf2)" data-act="respx" aria-label="Ocultar aviso">${I('x')}</button></div>`;
    }
    return h;
  },
  mount(el,ctx){
    const s=ctx.s;

    if(s.ir){const id=s.ir;s.ir=null;setTimeout(()=>seguir(el,ctx,id),60)}

function radar(p){

  return `<svg class="ini-radar" viewBox="0 0 220 220" width="220" height="220" aria-label="Distancia desde la tienda">${[100,75,50,25].map((r,i)=>`<circle cx="110" cy="110" r="${r}" fill="${['var(--surf2)','var(--acc-soft)','var(--surf2)','var(--acc-soft)'][i]}" stroke="var(--line)" stroke-width="1.500"/>`).join('')}<path d="M110 10v200M10 110h200" stroke="var(--line)" stroke-width="1"/>${['12','8','5','3'].map((t,i)=>`<text x="${110+[100,75,50,25][i]*0.72+2}" y="${110-[100,75,50,25][i]*0.72-2}" font-size="10" font-weight="800" fill="var(--ink3)">${t} km</text>`).join('')}<circle cx="110" cy="110" r="9" fill="var(--acc)"/><path d="M106 110h8M110 106v8" stroke="#fff" stroke-width="2"/>${km!=null?`<g style="animation:ini-sube .5s both;transform-origin:${110+Math.cos(a)*Math.min(km,12)/12*100}px ${110+Math.sin(a)*Math.min(km,12)/12*100}px"><circle cx="${110+Math.cos(a)*Math.min(km,12)/12*100}" cy="${110+Math.sin(a)*Math.min(km,12)/12*100}" r="9" fill="var(--c-aprender)" stroke="#fff" stroke-width="3"/></g>`:''}</svg>`;
}

  /* =========================================================

  const CM=[

  const chipEst={lista:['Lista','ok','check'],revisar:['Revisar','warn','warn'],fallo:['No se leyó','bad','x'],guardada:['Guardada','acc','check']};

  function campo(s,key,label,b,i){

  /* =========================================================

  const TIPOS=[{n:'Taxi',c:'var(--c-taxi)',claro:true,k:'taxi'},{n:'Expo Vino',c:'var(--c-adic)',zonas:true,k:'adic'},{n:'Movilidad',c:'var(--c-apoyo)',k:'apoyo'}];
  const EV=DATA.expoZonas.map(z=>[z[0],z[1]]);
  const banda=m=>m<=850?'var(--c-cantidad)':m<=900?'var(--c-apoyo)':m<=1050?'var(--c-buscar)':m<=1200?'var(--c-stats)':'var(--c-adic)';
  const bandas=[['Hasta 8.50','var(--c-cantidad)'],['9.00','var(--c-apoyo)'],['10.00 – 10.50','var(--c-buscar)'],['11.00 – 12.00','var(--c-stats)'],['Más de 12','var(--c-adic)']];
  const tipoDe=n=>TIPOS.find(t=>t.n===n)||TIPOS[1];
  function evTotales(s){const z=s.z||{};let n=0,m=0;Object.keys(z).forEach(k=>{n+=z[k];m+=z[k]*(EV[k]?EV[k][1]:0)});return {n,m}}
  function parseTabla(txt){
    const out=[];String(txt||'').split(/\r?\n/).forEach(l=>{const m=l.trim().match(/^(.*?)[\s:\-–\t]+(?:S\/\.?\s*)?(\d+(?:[.,]\d{1,2})?)\s*$/i);if(m&&m[1].trim())out.push([m[1].trim(),parseSol(m[2])])});return out}

  App.sheet('adicional',{
    titulo:c=>'Adicional · '+H((c.s.tipo||c.p.tipo||'Expo Vino')),sub:'Taxi, Expo Vino, movilidad…',k:'adicional',
    render(c){
      const s=c.s;
      if(!s.init){s.init=1;s.tipo=TIPOS.some(t=>t.n===c.p.tipo)?c.p.tipo:'Expo Vino';s.z={};s.hist=[];s.dia='Vie'}
      const t=tipoDe(s.tipo);
      const tipos=`<div><span class="lbl">Tipo de adicional</span><div class="cap-tipos">${TIPOS.map(x=>UI.chip(x.n,s.tipo===x.n,`data-act="tipo" data-v="${H(x.n)}"`,x.claro?'':x.c).replace('class="chip col"',x.claro?'class="chip sun"':'class="chip col"')).join('')}${UI.chip(I('plus')+'Nuevo tipo',s.nuevo,'data-act="nuevo"')}</div>
        ${s.nuevo?`<div class="cap-nuevo rise" style="margin-top:8px"><input class="inp" data-f="nuevoN" placeholder="Nombre del tipo" value="${H(fv(s,'nuevoN',''))}"><button type="button" class="btn sm" data-act="crear">Crear</button></div>`:''}</div>`;
      let cuerpo='';
      if(t.n==='Taxi')cuerpo=taxiV(c);else if(t.zonas)cuerpo=expoV(c);else cuerpo=movV(c);
      return tipos+cuerpo;
    },
    pie(c){const s=c.s,t=tipoDe(s.tipo||c.p.tipo||'Expo Vino');
      return `<button type="button" class="btn ${t.zonas?'ok':''}" ${t.n==='Taxi'?'style="background:var(--c-taxi);color:var(--sun-ink)"':''} data-act="guardar">${I('check')}${t.zonas?'Guardar reparto':'Guardar adicional'}</button>`},
    acts:{
      tipo(el,ev,c){c.s.tipo=el.dataset.v;c.s.prev=0},
      nuevo(el,ev,c){c.s.nuevo=!c.s.nuevo},
      crear(el,ev,c){const n=(fv(c.s,'nuevoN','')||'').trim();if(!n){App.toast('Escribe el nombre del tipo','warn');return false}
        if(!TIPOS.some(t=>t.n.toLowerCase()===n.toLowerCase()))TIPOS.push({n,c:'var(--c-licencia)',k:'adic'});
        const real=TIPOS.find(t=>t.n.toLowerCase()===n.toLowerCase());c.s.tipo=real.n;c.s.nuevo=false;if(c.s.f)c.s.f.nuevoN='';App.toast('Tipo «'+real.n+'» creado')},
      ini(el,ev,c){c.s.ini=hhmm()},
      fin(el,ev,c){if(!c.s.ini){App.toast('Primero marca el inicio','warn');return false}c.s.fin=hhmm();c.s.km=8.2;c.s.kmNew=true;(c.s.f=c.s.f||{}).monto='22.00'},
      reiniciar(el,ev,c){c.s.ini=c.s.fin=null;c.s.km=0},
      zona(el,ev,c){const k=+el.dataset.i;c.s.z[k]=(c.s.z[k]||0)+1;c.s.hist.push(k);c.s.last=k;c.s.bump=true},
      deshacer(el,ev,c){const k=c.s.hist.pop();if(k==null){App.toast('No hay nada que deshacer','warn');return false}c.s.z[k]=Math.max(0,(c.s.z[k]||1)-1);c.s.last=null},
      tarifas(el,ev,c){c.s.tar=!c.s.tar},
      cargar(el,ev,c){const l=parseTabla(fv(c.s,'pega',''));if(!l.length){App.toast('No encontré líneas como «Zona 8.50»','warn');return false}
        EV.length=0;l.forEach(x=>EV.push(x));c.s.z={};c.s.hist=[];c.s.prev=0;App.toast(l.length+' zonas cargadas')},
      guardar(el,ev,c){const t=tipoDe(c.s.tipo);
        if(t.zonas&&!evTotales(c.s).n){App.toast('Toca las zonas donde repartiste','warn');return false}

        guardado(t.zonas?'¡Reparto guardado!':'¡Adicional guardado!');App.closeSheet();return false}
    },
    mount(h,c){
      const s=c.s,t=tipoDe(s.tipo||c.p.tipo||'Expo Vino');
      recolor(h,t.c,t.claro);bind(h,s);
      if(t.zonas){const tt=evTotales(s);contar(h,s,'capEvTot',tt.m,v=>tt.n+' '+(tt.n===1?'pedido':'pedidos')+' · '+sol(v))}
      $$('input[data-evi]',h).forEach(e=>e.addEventListener('input',()=>{const k=+e.dataset.evi;if(EV[k])EV[k][1]=parseSol(e.value)}));
      const kmEl=h.querySelector('#capTaxKm');if(kmEl&&s.kmNew){s.kmNew=false;UI.count(kmEl,s.km,v=>v.toFixed(1)+' km')}
      s.bump=false;
    },
    cambios:['El tipo de adicional son chips de color; la hoja toma el color del tipo','Expo Vino: se toca la zona cada vez que repartes un pedido (sin teclear números); el total sube con animación','Taxi: dos botones, «Marcar inicio» y «Marcar fin», con estado visible','Las tarifas se pegan como tabla («Zona 8.50») y se corrigen fila por fila']
  });

  function taxiV(c){
    const s=c.s,live=s.ini&&!s.fin;
    return `<div class="cap-marca">
        <button type="button" class="cap-mk ${s.ini?'done':'go'} ${live?'':''}" data-act="ini" ${s.ini?'':''}><span class="fg">${s.ini?I('check'):I('pin')}</span><b>${s.ini?'Inicio marcado':'Marcar inicio'}</b><small>${s.ini?'a las '+s.ini:'Al subir el cliente'}</small></button>
        <button type="button" class="cap-mk ${s.fin?'done':'stop'} ${live?'cap-live':''}" data-act="fin" ${s.ini?'':'style="opacity:.55"'}><span class="fg">${s.fin?I('check'):I('flag')}</span><b>${s.fin?'Fin marcado':'Marcar fin'}</b><small>${s.fin?'a las '+s.fin:'Al bajar el cliente'}</small></button>

      ${s.ini?`<button type="button" class="btn sec sm" style="width:auto;align-self:flex-start" data-act="reiniciar">${I('refresh')}Empezar de nuevo</button>`:''}`;
  }

  function expoV(c){
    const s=c.s,tt=evTotales(s);
    return `<div><span class="lbl">Zonas del reparto · toca una por cada pedido</span>
        <div class="cap-zonas">${EV.map((z,k)=>{const n=s.z[k]||0;return `<button type="button" class="cap-z" style="--zc:${banda(z[1])}" data-act="zona" data-i="${k}" data-n="${n}"><b>${H(z[0])}</b><small>${sol(z[1])}</small>${n?`<i class="cap-bad ${s.last===k&&s.bump?'pop':''}">${n}</i>`:''}</button>`}).join('')}</div></div>

  App.sheet('apoyo',{
    titulo:'Apoyo a otra tienda',sub:'Cubrí a otra tienda',k:'apoyo',
    render(c){
      const s=c.s;
      if(!s.init){s.init=1;s.modo='hora';s.tienda='Wong - Limatambo';s.ent=840;s.sal=1080;s.tarifa=18;s.tr=[{t:0,km:2.1},{t:1,km:4.8}]}

    acts:{

    sub:'Un registro del día',k:'adicional',

/* ---------- ayudas de dibujo ---------- */
const pillE=(e,cls='')=>`<span class="pg-st ${estTono(e)} ${cls}">${e==='En curso'?I('clock'):e==='Por cobrar'?I('warn'):I('check')}${e}</span>`;
function colBar(label,val,segs,max,i,txt){
  const h=Math.max(val/max*86,val?4:0);
  return `<div class="pg-col"><span class="v">${txt!=null?txt:val}</span><div class="pg-stk" style="height:${h}%;animation-delay:${i*.06}s">${segs.map(s=>`<i style="flex:${Math.max(s.v,0)};background:${s.c}"></i>`).join('')}</div><small>${label}</small></div>`;
}
function ac(ctx,o){o.open=!!ctx.s.ab[o.id];return UI.ac(o)}
function trackAc(root,ctx){
  $$('.ac',root).forEach(a=>{const h=$('.ac-h',a),id=a.dataset.acid;if(!id)return;
    h.addEventListener('click',()=>{ctx.s.ab[id]=!a.classList.contains('open')});});
}
function chip(t,sel,a,c,extra=''){return `<button type="button" class="chip col pg-ch" style="background:${c}${extra}" aria-pressed="${!!sel}" ${a}>${t}</button>`}
function flecha(){return I('fwd')}
function difHtml(calc,monto){
  if(monto==null||isNaN(monto))return '';
  const d=monto-calc;
  if(d===0)return UI.aviso('Cuadra justo con lo calculado.','ok');
  if(d<0)return UI.aviso(`Te pagaron de menos: <b>${solC(-d)}</b> por reclamar.`,'bad');
  return UI.aviso(`Te pagaron de más: <b>${solC(d)}</b> a tu favor.`,'ok');
}
const parseC=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:Math.round(n*100)};

/* =====================================================================
   PAGOS
   ===================================================================== */
function carretera(pct){
  const flags=[25,50,75,100].map(x=>`<span class="pg-fl ${pct>=x?'ok':''}" style="left:${x}%">${I('flag')}${x}</span>`).join('');
  return `<div class="pg-via" style="--p:${Math.min(100,pct)}%"><div class="pg-track">${flags}<div class="pg-asf"><i class="pg-lineas"></i></div><span class="pg-carro">${CAR(44)}</span></div></div>`;
}

function fuenteCard(ctx,f,w,d){
  const s=ctx.s,on=!!M.marc[f.k],abierta=s.abierta===f.k,tot=T[w];
  const pct=Math.round(f.m/tot*100);
  let det='';
  if(abierta){
    const dias=P[w].map((p,i)=>p?`<div class="pg-dd"><span>${dayLabel(w,i)}</span><span>${solC(dayF(w,i,f))}</span></div>`:'').join('');
    const peds=pedFu(w,f.k);
    const sh=s.faltan?peds.filter(r=>!isCont(r)):peds;
    const n=peds.filter(isCont).length;
    const filas=sh.map(r=>{const c=isCont(r);
      return `<div class="pg-ped ${c?'on':''}"><div><b>${r.c}</b><small>${r.t}</small></div><span class="m">${solC(r.m)}</span><button type="button" class="pg-cnt" data-act="cont" data-c="${r.c}" aria-pressed="${c}"><span class="bx">${I('check')}</span>La empresa contó este pedido</button></div>`}).join('');
    det=`<div class="pg-det"><b style="font-family:var(--f-display)">Días</b>${dias}${peds.length?`<b style="font-family:var(--f-display);margin-top:4px">Pedidos · ${n} de ${peds.length} contados por la empresa</b>${filas||UI.aviso('Todos están contados por la empresa.','ok')}`:`<p class="tiny">${f.k==='apoyo'?'Se paga por hora, no por pedido.':'Se paga por carrera.'}</p>`}</div>`;
  }
  return `<div class="pg-fu ${on?'on':''} ${f.claro?'claro':''} ${d||''}" style="--fc:${f.c}">
    <button type="button" class="pg-fu-top" data-act="fu" data-k="${f.k}" role="switch" aria-checked="${on}" aria-label="Sumar ${f.n}"><span class="pg-box">${I('check')}</span><span class="pg-fu-t"><b>${f.n}</b><small>${f.s} · ${pct} %</small></span><span class="pg-fu-m">${solC(f.m)}</span></button>
    <div class="pg-bar"><i style="width:${pct}%"></i></div>
    <button type="button" class="pg-ver" data-act="abrir" data-k="${f.k}" aria-expanded="${abierta}">${abierta?'Cerrar':'Ver días y pedidos'}${I('chev')}</button>${det}</div>`;
}

function barrasPagos(w,F){
  const marc=F.filter(f=>M.marc[f.k]);
  const vals=P[w].map((p,i)=>sum(marc.map(f=>dayF(w,i,f))));
  const mx=Math.max(...vals,1);
  return `<div class="pg-cols">${P[w].map((p,i)=>colBar(DN[i],vals[i],marc.map(f=>({v:dayF(w,i,f),c:f.c})),mx,i,vals[i]?Math.round(vals[i]/100):'')).join('')}</div>`;
}

function diaPanel(ctx,w){
  const s=ctx.s;
  return `<div style="display:flex;flex-direction:column;gap:8px">`+M.dias[w].map((e,i)=>{
    const lab=dayLabel(w,i),ab=s.dia===i;
    const pill=e==='c'?UI.pill('Cargado','ok','check'):e==='f'?UI.pill('Sin cargar','warn','warn'):e==='r'?UI.pill('Descanso','acc','moon'):UI.pill('Falta','','clock');
    const res=e==='c'?`${P[w][i]} pedidos · ${RU[w][i]} rutas`:e==='f'?'Aún no subes este día':e==='r'?'Día de descanso':'Todavía no llega';
    let body='';
    if(ab){
      if(e==='c')body=`<div class="pg-k4"><div class="kpi"><b>${P[w][i]}</b><small>Pedidos</small></div><div class="kpi"><b>${solC(dayMonto(w,i))}</b><small>Ganado</small></div></div><p class="tiny">${i===3&&w===0?'Cubierto por permanencia en tienda.':'Rutas con hora y entrega registradas.'}</p>${UI.btn({t:'Abrir en Inicio',i:'home',a:'data-go="inicio"'})}`;
      else if(e==='f')body=`<div class="row">${UI.btn({t:'Subir el día',i:'cargar',c:'var(--acc)',a:'data-sheet="cargar"'})}${UI.btn({t:'No trabajé',i:'moon',cls:'sec',a:`data-act="desc" data-i="${i}"`})}</div>`;
      else if(e==='r')body=UI.btn({t:'Quitar descanso',i:'refresh',cls:'sec',a:`data-act="quitar" data-i="${i}"`});
      else body='<p class="tiny">Este día todavía no llega.</p>';
    }
    return `<div class="pg-dia"><button type="button" class="pg-dia-h" data-act="dia" data-i="${i}" aria-expanded="${ab}"><span><b>${lab}</b><small>${res}</small></span><span class="r">${e==='c'?solC(dayMonto(w,i)):''}<br>${pill}</span></button>${ab?`<div class="pg-dia-b">${body}</div>`:''}</div>`;
  }).join('')+`</div>`;
}

function zonaPanel(){
  const cnt={};DATA.pedidos.forEach(p=>{if(p.z){const c=cnt[p.z]=cnt[p.z]||{n:0,m:0};c.n++;c.m+=p.m}});
  const mx=Math.max(...Object.values(cnt).map(x=>x.n));
  const col={Miraflores:'var(--c-comanda)',Surquillo:'var(--c-cantidad)','Santiago de Surco':'var(--c-apoyo)',Chorrillos:'var(--c-mano)'};
  return Object.entries(cnt).map(([z,c])=>`<div><div style="display:flex;justify-content:space-between;font-weight:800"><span>${z}</span><span>${c.n} · ${solC(c.m)}</span></div><div class="barra"><i style="width:${c.n/mx*100}%;background:${col[z]||'var(--acc)'}"></i></div></div>`).join('');
}

/* =====================================================================

const wName=w=>'Sem. '+RANGO[w];
const dow=w=>diasCarg(w)||P[w].filter(x=>x).length;
const prom=w=>Math.round(T[w]/Math.max(1,P[w].filter(x=>x).length));
const lejos=w=>Math.round(sumP(w)*0.22);

function velocimetro(w,F){
  const tot=T[w],L=Math.PI*80,den=Math.max(META,tot);let acc=0;
  const arc='M 20 100 A 80 80 0 0 1 180 100';
  const segs=F.map(f=>{const l=f.m/den*L,o=-acc;acc+=l;return `<path d="${arc}" fill="none" stroke-width="16" style="stroke:${f.c};stroke-dasharray:${Math.max(l-2,0)} ${L};stroke-dashoffset:${o}"/>`}).join('');
  const ang=-90+180*Math.min(1,tot/META);
  const ticks=[0,25,50,75,100].map(p=>{const a=(-180+1.8*p)*Math.PI/180;return `<line x1="${100+68*Math.cos(a)}" y1="${100+68*Math.sin(a)}" x2="${100+60*Math.cos(a)}" y2="${100+60*Math.sin(a)}" stroke="var(--ink3)" stroke-width="2"/>`}).join('');
  return `<div class="pg-vel"><svg viewBox="0 0 200 118" width="100%" aria-label="Velocímetro de meta"><path d="${arc}" fill="none" stroke-width="16" style="stroke:var(--surf2)"/>${segs}${ticks}<g class="pg-needle" data-ang="${ang}" style="transform-origin:100px 100px;transform:rotate(-90deg)"><path d="M96 100 L100 36 L104 100z" style="fill:var(--ink)"/></g><circle cx="100" cy="100" r="9" style="fill:var(--ink)"/><circle cx="100" cy="100" r="3.5" fill="#ffc800"/><text x="20" y="116" font-size="9" font-weight="800" text-anchor="middle" style="fill:var(--ink3)">0</text><text x="180" y="116" font-size="9" font-weight="800" text-anchor="middle" style="fill:var(--ink3)">${Math.round(META/100)}</text></svg>
  <div class="pg-vel-c"><b>${Math.round(tot/META*100)} %</b></div></div>`;
}
function radar(w){
  const base=[58,18,6,3,1],k=sumP(w)/86,vals=base.map(v=>Math.max(1,Math.round(v*k)));
  const mx=Math.max(...vals),cx=100,cy=100,R=60,lab=['0–3 km','3–8','8–10','10–11','11–12'];
  const pt=(i,r)=>{const a=(-90+72*i)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=f=>[0,1,2,3,4].map(i=>pt(i,R*f).map(x=>x.toFixed(1)).join(',')).join(' ');
  return `<svg class="pg-radar" viewBox="0 0 200 200" width="100%" style="max-width:260px;display:block;margin:auto" aria-label="Pedidos por distancia">${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" style="stroke:var(--line)" stroke-width="2"/>`).join('')}${[0,1,2,3,4].map(i=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)" stroke-width="1.5"/>`}).join('')}<polygon class="v" points="${vals.map((v,i)=>pt(i,R*v/mx).map(x=>x.toFixed(1)).join(',')).join(' ')}" style="fill:var(--c-stats);stroke:var(--c-stats)" fill-opacity=".35" stroke-width="3"/>${vals.map((v,i)=>{const [x,y]=pt(i,R*v/mx);return `<circle cx="${x}" cy="${y}" r="4" style="fill:var(--c-stats)"/>`}).join('')}${lab.map((t,i)=>{const [x,y]=pt(i,R+17);return `<text x="${x}" y="${y+3}" font-size="10" font-weight="800" text-anchor="middle" style="fill:var(--ink2)">${t} · ${vals[i]}</text>`}).join('')}</svg>`;
}
function medalla(c,ic,t,s,i){return `<div class="pg-med"><span class="o" style="background:${c};animation-delay:${i*.08}s">${I(ic)}</span><div><b>${t}</b><small>${s}</small></div></div>`}

function statsSemana(ctx){
  const s=ctx.s,w=s.A,F=fuentes(w),tot=T[w];
  const vals=P[w].map((p,i)=>s.barra==='sol'?dayMonto(w,i):p),mx=Math.max(...vals,1);
  const cols=P[w].map((p,i)=>{
    const v=vals[i],far=s.barra==='sol'?roundC(v*.22):Math.round(v*.22);
    return colBar(DN[i],v,[{v:far,c:'var(--warn)'},{v:v-far,c:'var(--c-stats)'}],mx,i,v?(s.barra==='sol'?Math.round(v/100):v):'');
  }).join('');
  return `<div class="pg-sel"><button type="button" class="pg-arr" data-act="a-ant" aria-label="Semana anterior" ${w>=4?'disabled':''}>${I('back')}</button><div class="pg-sel-c"><b>${wName(w)}</b><small>${estadoSem(w)}</small></div><button type="button" class="pg-arr" data-act="a-sig" aria-label="Semana siguiente" ${w<=0?'disabled':''}>${I('fwd')}</button></div>
  <div class="pg-k4">
    <div class="pg-k" style="background:var(--c-comanda)"><b>${sumP(w)}</b><small>Pedidos</small></div>
    <div class="pg-k" style="background:var(--c-pagos);animation-delay:.07s"><b>${solC(tot)}</b><small>Soles</small></div>
    <div class="pg-k" style="background:var(--c-stats);animation-delay:.14s"><b>${P[w].filter(x=>x).length}</b><small>Días trabajados</small></div>

      return `<div class="card rise aju-cent" style="padding:18px"><svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><circle cx="60" cy="60" r="54" style="fill:var(--acc-soft)"/><g class="aju-escudo"><path d="M60 22l30 11v22c0 20-13 32-30 38-17-6-30-18-30-38V33z" style="fill:var(--acc)"/><path d="M45 58l11 11 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></svg><h2>Antes de empezar</h2><p class="muted">Tus clientes confían en ti. Cuida sus datos.</p></div>`+
        `<div style="margin-top:12px">${UI.ac({id:'aviso',t:'Aviso legal y protección de datos de tus clientes',k:'licencia',i:'doc',body:'<p class="aju-txt">Los nombres, teléfonos y direcciones de tus clientes son <b>datos personales</b>. Guárdalos solo para entregar sus pedidos y no los compartas.</p><p class="aju-txt">La app los guarda únicamente en tu teléfono. Si haces un respaldo, el archivo también los contiene: cuídalo.</p><p class="aju-txt">Puedes borrar los datos de un cliente cuando quieras desde su pedido.</p>'})}</div>`+
        `<button type="button" class="aju-check" style="margin-top:12px" aria-pressed="${!!s.ok}" data-act="acepto"><span class="caja">${I('check')}</span><span>He leído y acepto el aviso legal</span></button>`+
        `<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px"><button type="button" id="aju-acepta" class="btn ok ${s.ok?'':'dis'}" data-act="acepta">${I('check')}Aceptar y continuar</button>${UI.btn({t:'No acepto',cls:'sec',a:'data-act="rechaza"'})}</div>`;
    },
    acts:{
      acepto(el,e,c){c.s.ok=!c.s.ok;el.setAttribute('aria-pressed',!!c.s.ok);const b=document.getElementById('aju-acepta');if(b)b.classList.toggle('dis',!c.s.ok);return false},
      acepta(el,e,c){if(!c.s.ok){App.toast('Marca la casilla primero','warn');return false}App.confetti();App.toast('¡Listo, bienvenido!');App.go('inicio');return false},
      rechaza(el,e,c){App.toast('Sin aceptar no se puede usar la app','warn');return false}
    }
  });

  /* ---------------- sin conexión ---------------- */
  App.screen('sinconexion',{titulo:'Sin conexión',icono:'wifioff',tab:null,grupo:'Sistema',
    cambios:['Una ilustración animada explica la situación de un vistazo','Dos botones llevan a lo que sí funciona sin red','Dice sin rodeos que cargar capturas necesita internet'],
    render(ctx){
      return `<div class="aju-cent rise" style="padding-top:8px"><svg viewBox="0 0 200 160" width="220" aria-hidden="true"><circle class="aju-onda" cx="100" cy="86" r="40" style="fill:var(--warn-soft)"/><circle class="aju-onda d" cx="100" cy="86" r="40" style="fill:var(--warn-soft)"/><g class="aju-nube"><path d="M62 112a22 22 0 010-44 32 32 0 0161 8 19 19 0 013 36z" style="fill:var(--warn)"/><path d="M80 80l40 40M120 80L80 120" stroke="#fff" stroke-width="7" stroke-linecap="round" transform="translate(0 -4) scale(1) "/></g></svg><h2>Sin conexión</h2><p class="muted">Tu historial y tus estadísticas siguen disponibles. Para cargar capturas necesitas internet.</p>`+
        `<div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px">${UI.fila({k:'historial',t:'Ver el historial',s:'Tus pedidos guardados',a:'data-go="historial"'})}${UI.fila({k:'stats',t:'Ver estadísticas',s:'Tu semana y tu mes',a:'data-go="stats"'})}</div>`+UI.aviso('Cuando vuelva la señal, todo seguirá como lo dejaste.','warn','wifioff')+`</div>`;
    }
  });

  /* ---------------- error ---------------- */
  App.screen('error',{titulo:'Algo falló',icono:'warn',tab:null,grupo:'Sistema',
    cambios:['Un triángulo que se mueve y una sola frase, sin términos técnicos','Tres botones claros: reintentar, ir al inicio, ver el detalle','El detalle para soporte queda escondido, con botón Copiar'],
    render(ctx){
      const det='Error: TypeError: Cannot read properties of undefined (reading \'pedidos\')\n  en Pantalla.render (pagos.js:214)\n  en App.draw (app.js:88)\nVersión 1.29 · 29/10/2026 10:24 · pantalla: pagos';ctx.s._det=det;
      return `<div class="aju-cent rise" style="padding-top:8px"><svg viewBox="0 0 120 110" width="150" aria-hidden="true"><g class="aju-wob"><path d="M60 8l52 92H8z" style="fill:var(--warn)" stroke="var(--warn)" stroke-width="8" stroke-linejoin="round"/><path d="M60 40v28M60 80v.01" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g></svg><h2>Esta pantalla no se pudo mostrar</h2><p class="muted">No perdiste nada. Intenta de nuevo.</p>`+
        `<div style="width:100%;display:flex;flex-direction:column;gap:10px">${UI.btn({t:'Volver a intentar',i:'refresh',a:'data-act="reintenta"'})}${UI.btn({t:'Ir al inicio',i:'home',cls:'sec',a:'data-go="inicio"'})}</div>`+
        `<div style="width:100%;text-align:left">${UI.ac({id:'det',t:'Detalle para soporte',i:'doc',c:'var(--c-ajustes)',body:`<div class="aju-caja">${X(det)}</div>${UI.btn({t:'Copiar',i:'copy',cls:'sec',a:'data-act="copia"'})}`})}</div></div>`;
    },
    acts:{
      reintenta(el,e,c){App.toast('Intentando de nuevo…');setTimeout(()=>{if(App.cur().id==='error')App.go('inicio')},500);return false},
      copia(el,e,c){copiar(c.s._det||'');App.toast('Detalle copiado');return false}
    }
  });
})();

/* ===== recorridos rápidos (los flujos más usados) y arranque ===== */
(function(){
  const R=[
    ['Anotar pedidos de una comanda',()=>{App.go('inicio');App.openSheet('subirmas')}],
    ['Ver cuánto llevo hoy',()=>App.go('inicio')],
    ['Corregir un pedido',()=>{App.go('inicio');App.openSheet('pedido',{i:0})}],
    ['Registrar Expo Vino por zonas',()=>{App.go('inicio');App.openSheet('adicional',{tipo:'Expo Vino'})}],
    ['Registrar apoyo a otra tienda',()=>{App.go('inicio');App.openSheet('apoyo')}],
    ['Revisar la semana y cotejar con la empresa',()=>{App.go('pagos');App.openSheet('cotejo')}],
    ['Cargar el resumen del día',()=>App.openSheet('cargar')],
    ['Activar mi licencia',()=>App.go('ajustes',{abre:'licencia'})]
  ];
  $('#recorridos').innerHTML=R.map(([t],i)=>`<button type="button" data-r="${i}"><i>${i+1}</i>${t}</button>`).join('');
  $('#recorridos').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){R[+b.dataset.r][1]()}});
  App.start();
})();
</script>
